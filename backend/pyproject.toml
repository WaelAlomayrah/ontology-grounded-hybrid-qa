[project]
name = "ontology-ai-pilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6", "uvicorn[standard]==0.34.0", "pydantic==2.10.4",
  "pydantic-settings==2.7.0", "httpx==0.28.1", "rdflib==7.1.1",
  "pymilvus==2.5.3", "sentence-transformers==3.3.1", "pandas==2.2.3",
  "python-multipart==0.0.20", "prometheus-fastapi-instrumentator==7.0.0",
  "prometheus-client==0.21.1"
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.0", "ruff==0.8.4", "mypy==1.13.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires running Docker services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
