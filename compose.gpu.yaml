services:
  ollama:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  backend:
    image: ontology-ai-pilot-backend-gpu:latest
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
    environment:
      EMBEDDING_DEVICE: cuda
      EMBEDDING_BATCH_SIZE: 64
      TRITON_CACHE_DIR: /tmp/triton
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  data-loader:
    image: ontology-ai-pilot-data-loader-gpu:latest
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
    environment:
      EMBEDDING_DEVICE: cuda
      EMBEDDING_BATCH_SIZE: 64
      TRITON_CACHE_DIR: /tmp/triton
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
