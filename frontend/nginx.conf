server {
  listen 8080;
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header X-Request-ID $request_id; }
  location /health { proxy_pass http://backend:8000; }
  location / { try_files $uri /index.html; }
}
