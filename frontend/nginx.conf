server {
  listen 8080;
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  # Compatibility for browser tabs that loaded the pre-job frontend. New
  # clients use /evaluation/jobs, but an in-flight legacy benchmark must not
  # be cut off by nginx's 60-second default.
  location = /api/v1/evaluation/run {
    proxy_pass http://backend:8000;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30m;
    proxy_read_timeout 30m;
  }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header X-Request-ID $request_id; }
  location /health { proxy_pass http://backend:8000; }
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store" always;
  }
}
